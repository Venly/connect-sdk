name: 🛫 Release Start
on:
  workflow_dispatch:
permissions:
  contents: write
run-name: 🛫 release-start
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: ./.github/actions/release_start
        with:
          token: ${{ github.token }}
