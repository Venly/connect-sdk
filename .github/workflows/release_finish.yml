name: 🛬 Release Finish
on:
  workflow_dispatch:
permissions:
  contents: write
run-name: 🛬 release-finish
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: ./.github/actions/release_finish
        with:
          token: ${{ github.token }}
