name: 🩹 Hotfix Finish
on:
  workflow_dispatch:
permissions:
  contents: write
run-name: 🩹 hotfix-finish
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: ./.github/actions/hotfix_finish
        with:
          token: ${{ github.token }}
